<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus Poll Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        
        .toolbar {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 5px 5px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .toolbar h1 {
            font-size: 20px;
            margin-right: 20px;
        }
        
        .toolbar select,
        .toolbar input,
        .toolbar button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .toolbar button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }
        
        .toolbar button:hover {
            background-color: #2980b9;
        }
        
        .toolbar button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        
        .status-bar {
            background-color: #34495e;
            color: white;
            padding: 10px 15px;
            border-bottom: 2px solid #2c3e50;
        }
        
        #status {
            font-weight: bold;
        }
        
        #status.connected {
            color: #2ecc71;
        }
        
        #status.disconnected {
            color: #e74c3c;
        }
        
        .data-table {
            background-color: white;
            padding: 20px;
            border-radius: 0 0 5px 5px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background-color: #3498db;
            color: white;
            font-weight: bold;
        }
        
        tr:hover {
            background-color: #f5f5f5;
        }
        
        .side-panel {
            background-color: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .side-panel h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .logs {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #dee2e6;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry.error {
            color: #e74c3c;
        }
        
        .log-entry.success {
            color: #2ecc71;
        }
        
        .log-entry.info {
            color: #3498db;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>Modbus Poll Interface</h1>
        <select id="connectionType" onchange="updateConnectionFields()">
            <option value="serial">Serial (RS485)</option>
            <option value="tcp">TCP/IP</option>
        </select>
        <input type="text" id="ipAddress" placeholder="IP Address" style="display:none;">
        <input type="number" id="port" placeholder="Port" value="502" style="display:none;">
        <input type="text" id="serialPort" placeholder="Serial Port" value="COM1">
        <button id="connectButton" onclick="toggleConnection()">Connect</button>
    </div>
    <div class="status-bar">
        <div id="status" class="disconnected">Disconnected</div>
    </div>
    <div class="data-table">
        <table>
            <thead>
                <tr>
                    <th>Address</th>
                    <th>Value (uint16)</th>
                    <th>Value (int16)</th>
                    <th>Value (float32)</th>
                    <th>Value (uint32)</th>
                    <th>Binary</th>
                    <th>Voltage</th>
                </tr>
            </thead>
            <tbody id="dataTableBody">
                <!-- Data rows will be populated here dynamically -->
            </tbody>
        </table>
    </div>
    <div class="side-panel">
        <h2>Statistics & Logs</h2>
        <div class="logs" id="logs">
            <div class="log-entry info">System initialized. Ready to connect.</div>
        </div>
    </div>

<script>
// Constants
const POLLING_INTERVAL_MS = 2000;
const MAX_LOG_ENTRIES = 50;
const VOLTAGE_RANGE = 380;
const VOLTAGE_MIN = 20;

// Global connection state
let isConnected = false;
let pollingInterval = null;
let sampleData = [];

// Initialize sample data on page load
function initializeSampleData() {
    for (let i = 0; i < 10; i++) {
        sampleData.push({
            address: 40001 + i,
            uint16Value: Math.floor(Math.random() * 65536),
            int16Value: Math.floor(Math.random() * 65536) - 32768,
            float32Value: (Math.random() * 1000).toFixed(2),
            uint32Value: Math.floor(Math.random() * 4294967296),
            binaryValue: '0b' + Math.floor(Math.random() * 65536).toString(2).padStart(16, '0'),
            voltageValue: (Math.random() * VOLTAGE_RANGE + VOLTAGE_MIN).toFixed(2)
        });
    }
    updateDataTable();
}

// Update connection field visibility based on connection type
function updateConnectionFields() {
    const connectionType = document.getElementById('connectionType').value;
    const ipAddress = document.getElementById('ipAddress');
    const port = document.getElementById('port');
    const serialPort = document.getElementById('serialPort');
    
    if (connectionType === 'tcp') {
        ipAddress.style.display = 'inline-block';
        port.style.display = 'inline-block';
        serialPort.style.display = 'none';
        addLog('Switched to TCP/IP mode', 'info');
    } else {
        ipAddress.style.display = 'none';
        port.style.display = 'none';
        serialPort.style.display = 'inline-block';
        addLog('Switched to Serial (RS485) mode', 'info');
    }
}

// Toggle connection
function toggleConnection() {
    if (isConnected) {
        disconnect();
    } else {
        connect();
    }
}

// Connect to Modbus device
function connect() {
    const connectionType = document.getElementById('connectionType').value;
    const connectButton = document.getElementById('connectButton');
    const status = document.getElementById('status');
    
    connectButton.disabled = true;
    
    if (connectionType === 'serial') {
        const serialPort = document.getElementById('serialPort').value;
        addLog(`Connecting to Serial port: ${serialPort}...`, 'info');
        
        // Simulate connection delay
        setTimeout(() => {
            isConnected = true;
            status.textContent = `Connected - Serial (${serialPort})`;
            status.className = 'connected';
            connectButton.textContent = 'Disconnect';
            connectButton.disabled = false;
            addLog(`Successfully connected to ${serialPort}`, 'success');
            startPolling();
        }, 1000);
    } else if (connectionType === 'tcp') {
        const ip = document.getElementById('ipAddress').value;
        const port = document.getElementById('port').value;
        
        if (!ip || !port) {
            addLog('Error: Please enter IP address and port', 'error');
            connectButton.disabled = false;
            return;
        }
        
        addLog(`Connecting to TCP: ${ip}:${port}...`, 'info');
        
        // Simulate connection delay
        setTimeout(() => {
            isConnected = true;
            status.textContent = `Connected - TCP (${ip}:${port})`;
            status.className = 'connected';
            connectButton.textContent = 'Disconnect';
            connectButton.disabled = false;
            addLog(`Successfully connected to ${ip}:${port}`, 'success');
            startPolling();
        }, 1000);
    }
}

// Disconnect from Modbus device
function disconnect() {
    const connectButton = document.getElementById('connectButton');
    const status = document.getElementById('status');
    
    stopPolling();
    isConnected = false;
    status.textContent = 'Disconnected';
    status.className = 'disconnected';
    connectButton.textContent = 'Connect';
    addLog('Disconnected from device', 'info');
}

// Start polling data
function startPolling() {
    addLog('Started polling Modbus registers...', 'info');
    pollingInterval = setInterval(() => {
        updateSampleData();
        updateDataTable();
    }, POLLING_INTERVAL_MS);
}

// Stop polling data
function stopPolling() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        addLog('Stopped polling', 'info');
    }
}

// Update sample data (simulate real data changes)
function updateSampleData() {
    sampleData.forEach(item => {
        item.uint16Value = Math.floor(Math.random() * 65536);
        item.int16Value = Math.floor(Math.random() * 65536) - 32768;
        item.float32Value = (Math.random() * 1000).toFixed(2);
        item.uint32Value = Math.floor(Math.random() * 4294967296);
        item.binaryValue = '0b' + item.uint16Value.toString(2).padStart(16, '0');
        item.voltageValue = (Math.random() * VOLTAGE_RANGE + VOLTAGE_MIN).toFixed(2);
    });
}

// Update data table with current values
function updateDataTable() {
    const tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';
    
    sampleData.forEach(item => {
        const row = tbody.insertRow();
        row.innerHTML = `
            <td>${item.address}</td>
            <td>${item.uint16Value}</td>
            <td>${item.int16Value}</td>
            <td>${item.float32Value}</td>
            <td>${item.uint32Value}</td>
            <td>${item.binaryValue}</td>
            <td>${item.voltageValue}V</td>
        `;
    });
}

// Add log entry
function addLog(message, type = 'info') {
    const logs = document.getElementById('logs');
    const timestamp = new Date().toLocaleTimeString();
    const logEntry = document.createElement('div');
    logEntry.className = `log-entry ${type}`;
    logEntry.textContent = `[${timestamp}] ${message}`;
    logs.appendChild(logEntry);
    
    // Auto-scroll to bottom
    logs.scrollTop = logs.scrollHeight;
    
    // Keep only last entries based on MAX_LOG_ENTRIES constant
    while (logs.children.length > MAX_LOG_ENTRIES) {
        logs.removeChild(logs.firstChild);
    }
}

// Initialize on page load
window.addEventListener('DOMContentLoaded', () => {
    initializeSampleData();
    updateConnectionFields();
    addLog('Application loaded successfully', 'success');
});
</script>
</body>
</html>
