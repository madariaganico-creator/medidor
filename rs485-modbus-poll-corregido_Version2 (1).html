<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus Poll</title>
    <style>
        /* Add any necessary CSS here */
    </style>
</head>
<body>
    <h1>Modbus Poll</h1>
    <div>
        <label for="connection-type">Select Connection Type:</label>
        <select id="connection-type" onchange="toggleConnectionFields()">
            <option value="serial">Serial</option>
            <option value="tcp">TCP/IP</option>
        </select>
    </div>
    <div id="tcp-fields" style="display:none;">
        <label for="ip-address">IP Address:</label>
        <input type="text" id="ip-address" placeholder="Enter IP Address">
        <label for="port">Port:</label>
        <input type="number" id="port" value="502">
    </div>
    <div>
        <!-- Existing UI components remain unchanged -->
    </div>

    <script>
        function toggleConnectionFields() {
            const connectionType = document.getElementById('connection-type').value;
            const tcpFields = document.getElementById('tcp-fields');
            tcpFields.style.display = connectionType === 'tcp' ? 'block' : 'none';
        }

        function sendModbusCommand(command) {
            const connectionType = document.getElementById('connection-type').value;
            if (connectionType === 'tcp') {
                const ipAddress = document.getElementById('ip-address').value;
                const port = document.getElementById('port').value;
                // Implement TCP socket connection using WebSocket or fetch API
                fetch(`http://${ipAddress}:${port}/modbus`, {
                    method: 'POST',
                    body: JSON.stringify(command),
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(response => response.json())
                .then(data => {
                    // Handle successful response
                    updateStatus('Connected to ' + ipAddress + ':' + port);
                })
                .catch(error => {
                    // Handle errors
                    updateStatus('Connection error: ' + error);
                });
            } else {
                // Existing serial connection handling
                // ... your serial connection code here
            }
        }

        function updateStatus(message) {
            // Update the UI to show the connection status
            console.log(message);
        }
    </script>
</body>
</html>
